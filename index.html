<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Cash Empire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: banker's ledger desk — click vault left, businesses middle, trading floor right; single dark "vault" look */
:root{
  --bg:#0c1410; --panel:#132019; --panel2:#1a2b21; --line:#2a4234;
  --fg:#e8f2ea; --muted:#8fa898; --money:#5ee08a; --gold:#f2c14e; --red:#ff6b6b;
  --display:"Rubik Mono One",Impact,sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:16px 40px;
  background-image:radial-gradient(circle at 20% 0%,#16301f 0,transparent 50%)}
header{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;justify-content:space-between;max-width:1280px;margin:0 auto 16px}
h1{font-family:var(--display);font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:.02em;color:var(--money)}
.stats{display:flex;flex-wrap:wrap;gap:8px 24px}
.stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stat b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.stat.cash b{color:var(--money);font-size:26px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"vault biz stocks" "cards biz stocks";align-items:start;gap:16px;max-width:1280px;margin:0 auto}
#t-vault{grid-area:vault}#t-cards{grid-area:cards}#t-biz{grid-area:biz}#t-stocks{grid-area:stocks}
@media(max-width:980px) and (min-width:701px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"vault cards" "biz stocks"}}
nav.tabs{display:none}
#mini{display:none}
@media(max-width:700px){
  body{padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));touch-action:manipulation}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px 12px;padding:10px 16px;border-bottom:1px solid var(--line);gap:6px 16px;align-items:center}
  h1{font-size:18px}
  .stats{gap:4px 16px;width:100%}
  .stat b{font-size:15px}.stat.cash b{font-size:22px}
  .stat.cash{flex-basis:100%}
  main{display:block}
  main>section{display:none}
  main>section.active{display:block}
  #bill{width:100%;font-size:54px}
  .clickzone{padding-block:20px 24px}
  .wallet{grid-template-columns:repeat(2,minmax(0,1fr))}
  button.buy{min-height:44px}
  .acts button{padding:10px 12px;flex:1 1 auto}
  .acts .hold{flex-basis:100%;margin-left:0}
  nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0a110d;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  nav.tabs button{background:none;border:none;color:var(--muted);font:700 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:10px;cursor:pointer}
  nav.tabs button span{font-size:20px;line-height:1}
  nav.tabs button.on{color:var(--money);background:var(--panel)}
  #mini{display:flex;position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:9;width:64px;height:64px;border-radius:50%;border:none;background:linear-gradient(135deg,#3f8f5c,#2a6a42);color:#d9f5df;font:28px var(--display);align-items:center;justify-content:center;box-shadow:0 6px 18px #000a}
  #mini:active{transform:scale(.92)}
  body.on-vault #mini{display:none}
  .foot{justify-content:center}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h2{font-family:var(--display);font-size:13px;letter-spacing:.08em;margin:0 0 12px;color:var(--gold)}
.clickzone{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px 18px;position:relative;user-select:none}
#bill{width:min(100%,300px);aspect-ratio:2.2/1;border:none;border-radius:10px;cursor:pointer;position:relative;
  background:linear-gradient(135deg,#3f8f5c,#2a6a42 60%,#3f8f5c);box-shadow:0 8px 0 #1b4a2c,0 14px 30px #0008;
  color:#d9f5df;font-family:var(--display);font-size:42px;transition:transform .06s}
#bill::before{content:"";position:absolute;inset:8px;border:2px dashed #b9e8c6aa;border-radius:6px}
#bill::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;left:50%;top:50%;translate:-50% -50%;border:2px solid #b9e8c666}
#bill:active{transform:translateY(6px);box-shadow:0 2px 0 #1b4a2c,0 6px 14px #0008}
#bill:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.pop{position:absolute;pointer-events:none;font-family:var(--mono);font-weight:700;color:var(--money);animation:pop .9s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes pop{to{transform:translateY(-70px);opacity:0}}
.hint{color:var(--muted);font-size:13px;text-align:center}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.list{display:flex;flex-direction:column;gap:8px}
.row .name{font-weight:800}
.row .sub{grid-column:1;font-size:12px;color:var(--muted);font-family:var(--mono)}
button.buy{grid-row:1/3;grid-column:2;font:700 13px var(--mono);border:none;border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--money);color:#06210f;min-width:96px}
button:disabled{background:#2c3b31!important;color:#6d8576!important;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.owned{color:var(--gold)}
/* cards */
.wallet{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
.cc{aspect-ratio:1.586;border-radius:10px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:11px;position:relative;cursor:pointer;border:2px solid transparent;color:#fff;text-align:left;width:100%}
.cc .chip{width:24px;height:18px;border-radius:4px;background:linear-gradient(135deg,#e9d38a,#a9873a)}
.cc .cname{font-family:var(--display);font-size:11px;letter-spacing:.04em}
.cc .perk{opacity:.9}
.cc.locked{filter:grayscale(.85) brightness(.6)}
.cc.equipped{border-color:var(--money);box-shadow:0 0 0 3px #5ee08a44}
.cc .tag{position:absolute;top:8px;right:8px;background:#000a;padding:2px 6px;border-radius:6px}
.t0{background:linear-gradient(135deg,#9aa3a0,#5f6866)}
.t1{background:linear-gradient(135deg,#d7dde3,#7d8a96);color:#14202a}
.t2{background:linear-gradient(135deg,#f6d36b,#b8862b);color:#2b1c00}
.t3{background:linear-gradient(135deg,#e6ecf5,#9fb0c8 50%,#e6ecf5);color:#1a2333}
.t4{background:linear-gradient(135deg,#7a3cff,#2b0f6b)}
.t5{background:radial-gradient(circle at 30% 20%,#333,#000);border-color:#444}
/* stocks */
.stock{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px 10px;padding:10px 12px;border-radius:10px;background:var(--panel2)}
.stock .tk{font-family:var(--mono);font-weight:700}
.stock .px{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--money)} .dn{color:var(--red)}
.stock canvas{grid-row:1/3;grid-column:2;width:110px;height:44px}
.stock .acts{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts button{font:700 12px var(--mono);border:1px solid var(--line);background:#0f1a14;color:var(--fg);border-radius:7px;padding:6px 10px;cursor:pointer}
.acts button.b{border-color:#2f7a4a;color:var(--money)} .acts button.s{border-color:#7a2f2f;color:var(--red)}
.acts .hold{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.news{font-family:var(--mono);font-size:12px;color:var(--gold);background:#0f1a14;border-radius:8px;padding:8px 10px;margin-bottom:10px;min-height:34px}
.foot{max-width:1280px;margin:14px auto 0;display:flex;justify-content:flex-end;gap:10px}
.foot button{font:600 12px var(--body);background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--gold);color:#2b1c00;font-weight:800;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}#bill{transition:none}}
</style>

<header>
  <h1>CASH EMPIRE</h1>
  <div class="stats">
    <div class="stat cash"><small>Cash</small><b id="cash">$0</b></div>
    <div class="stat"><small>Per second</small><b id="pps">$0</b></div>
    <div class="stat"><small>Per click</small><b id="ppc">$1</b></div>
    <div class="stat"><small>Net worth</small><b id="nw">$0</b></div>
  </div>
</header>

<main>
  <section id="t-vault" class="active">
    <h2>THE VAULT</h2>
    <div class="clickzone" id="zone">
      <button id="bill" aria-label="Earn money">$</button>
      <div class="hint">Tap the bill or press Space</div>
    </div>
    <h2>CLICK UPGRADES</h2>
    <div class="list" id="clickUps"></div>
  </section>

  <section id="t-cards">
    <h2>CREDIT CARDS</h2>
    <div class="hint" style="text-align:left;margin-bottom:6px">Your card multiplies every click and gives cashback on everything you buy.</div>
    <div class="wallet" id="wallet"></div>
  </section>

  <section id="t-biz">
    <h2>BUSINESSES</h2>
    <div class="list" id="biz"></div>
  </section>

  <section id="t-stocks">
    <h2>TRADING FLOOR</h2>
    <div class="news" id="news">Market open. Prices move every second.</div>
    <div class="list" id="stocks"></div>
  </section>
</main>
<div class="foot"><button id="reset">Reset game</button></div>
<button id="mini" aria-label="Earn money">$</button>
<nav class="tabs" id="tabs">
  <button data-t="t-vault" class="on"><span>💵</span>Vault</button>
  <button data-t="t-cards"><span>💳</span>Cards</button>
  <button data-t="t-biz"><span>🏪</span>Business</button>
  <button data-t="t-stocks"><span>📈</span>Stocks</button>
</nav>
<div id="toast"></div>

<script>
const fmt=n=>{const a=Math.abs(n);const u=[[1e15,"Q"],[1e12,"T"],[1e9,"B"],[1e6,"M"],[1e3,"K"]];for(const[v,s]of u)if(a>=v)return(n<0?"-$":"$")+(a/v).toFixed(2)+s;return(n<0?"-$":"$")+(a<100?a.toFixed(2):Math.floor(a))};

const BIZ=[
 {n:"Lemonade Stand",c:15,i:0.2},{n:"Vending Machine",c:120,i:1.5},{n:"Car Wash",c:1100,i:9},
 {n:"Food Truck",c:12000,i:55},{n:"Apartment Block",c:130000,i:320},{n:"Factory",c:1.4e6,i:1900},
 {n:"Bank",c:2e7,i:12000},{n:"Oil Rig",c:3.3e8,i:80000},{n:"Space Mine",c:5.1e9,i:520000}];
const CLICKS=[
 {n:"Leather Wallet",c:50,m:1},{n:"Cash Counter",c:600,m:3},{n:"Money Printer",c:8000,m:12},
 {n:"Gold Briefcase",c:1e5,m:60},{n:"Private Mint",c:2e6,m:400}];
const CARDS=[
 {n:"Prepaid",c:0,x:1,cb:0,t:"t0"},{n:"Silver Saver",c:750,x:2,cb:.01,t:"t1"},
 {n:"Gold Rewards",c:15000,x:4,cb:.02,t:"t2"},{n:"Platinum Elite",c:400000,x:8,cb:.03,t:"t3"},
 {n:"Amethyst Reserve",c:9e6,x:16,cb:.05,t:"t4"},{n:"Obsidian Infinite",c:2.5e8,x:40,cb:.08,t:"t5"}];
const STOCKS=[
 {t:"BNNA",n:"Banana Computers",p:42,v:.025,d:.0006},{t:"ROKT",n:"Rocket Rides Inc",p:180,v:.05,d:.0004},
 {t:"BURG",n:"Burger Planet",p:12,v:.015,d:.0003},{t:"MEME",n:"MemeCoin Holdings",p:3,v:.09,d:0},
 {t:"GOLD",n:"Golden Shovel Mining",p:950,v:.012,d:.0005}];
const NEWS={up:["{t} beats earnings! Shares surge.","Analysts upgrade {t} to Strong Buy.","{t} announces a giant new product."],
 dn:["{t} CEO caught napping in meeting. Shares slide.","{t} recalls 2 million units.","Rumors of {t} lawsuit spook investors."]};

let S;
function fresh(){return{cash:0,biz:BIZ.map(()=>0),clicks:CLICKS.map(()=>0),cards:[true,...CARDS.slice(1).map(()=>false)],card:0,
 stocks:STOCKS.map(s=>({p:s.p,h:0,cost:0,hist:Array(40).fill(s.p)})),total:0}}
function load(){try{const d=JSON.parse(localStorage.getItem("cashEmpire"));if(d&&d.biz){S=Object.assign(fresh(),d);return}}catch(e){}S=fresh()}
function save(){try{localStorage.setItem("cashEmpire",JSON.stringify(S))}catch(e){}}
load();

const card=()=>CARDS[S.card];
const pps=()=>BIZ.reduce((a,b,i)=>a+b.i*S.biz[i],0);
const ppc=()=>(1+CLICKS.reduce((a,c,i)=>a+c.m*S.clicks[i],0)+pps()*0.02)*card().x;
const bizCost=i=>BIZ[i].c*Math.pow(1.15,S.biz[i]);
const clickCost=i=>CLICKS[i].c*Math.pow(1.6,S.clicks[i]);
const stockVal=()=>S.stocks.reduce((a,s)=>a+s.p*s.h,0);
function spend(c){if(S.cash<c)return false;S.cash-=c;const back=c*card().cb;S.cash+=back;if(back>=1)toast(`${fmt(back)} cashback from ${card().n}`);return true}

let tt;function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),1600)}

// click
const bill=document.getElementById("bill"),zone=document.getElementById("zone");
function earn(ev){const v=ppc();S.cash+=v;S.total+=v;
 const p=document.createElement("div");p.className="pop";p.textContent="+"+fmt(v);
 const r=zone.getBoundingClientRect();const x=ev&&ev.clientX?ev.clientX-r.left:r.width/2+(Math.random()*80-40);const y=ev&&ev.clientY?ev.clientY-r.top:60;
 p.style.left=(x-20)+"px";p.style.top=(y-20)+"px";zone.appendChild(p);setTimeout(()=>p.remove(),900);draw()}
bill.addEventListener("click",earn);
document.getElementById("mini").addEventListener("click",()=>earn());
document.body.classList.add("on-vault");
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("active",s.id===b.dataset.t));
 document.body.classList.toggle("on-vault",b.dataset.t==="t-vault");window.scrollTo(0,0)});
document.addEventListener("keydown",e=>{if(e.code==="Space"&&e.target===document.body){e.preventDefault();earn()}});

// build lists
function buildBiz(){document.getElementById("biz").innerHTML=BIZ.map((b,i)=>`<div class="row"><div class="name">${b.n} <span class="owned" id="bo${i}"></span></div><div class="sub">+${fmt(b.i)}/s each</div><button class="buy" id="bb${i}" data-i="${i}"></button></div>`).join("")}
function buildClicks(){document.getElementById("clickUps").innerHTML=CLICKS.map((c,i)=>`<div class="row"><div class="name">${c.n} <span class="owned" id="co${i}"></span></div><div class="sub">+${fmt(c.m)} per click</div><button class="buy" id="cb${i}" data-i="${i}"></button></div>`).join("")}
function buildCards(){document.getElementById("wallet").innerHTML=CARDS.map((c,i)=>`<button class="cc ${c.t}" id="cc${i}" data-i="${i}"><span class="tag" id="ct${i}"></span><div class="chip"></div><div class="cname">${c.n.toUpperCase()}</div><div class="perk">x${c.x} clicks · ${Math.round(c.cb*100)}% back</div></button>`).join("")}
function buildStocks(){document.getElementById("stocks").innerHTML=STOCKS.map((s,i)=>`<div class="stock"><div><span class="tk">${s.t}</span> <span class="sub" style="color:var(--muted);font-size:12px">${s.n}</span></div><canvas id="sc${i}" width="220" height="88"></canvas><div class="px" id="sp${i}"></div><div class="acts"><button class="b" data-i="${i}" data-a="1">Buy 1</button><button class="b" data-i="${i}" data-a="10">Buy 10</button><button class="b" data-i="${i}" data-a="max">Buy max</button><button class="s" data-i="${i}" data-a="-1">Sell 1</button><button class="s" data-i="${i}" data-a="all">Sell all</button><span class="hold" id="sh${i}"></span></div></div>`).join("")}
buildBiz();buildClicks();buildCards();buildStocks();

document.getElementById("biz").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;if(spend(bizCost(i))){S.biz[i]++;draw()}});
document.getElementById("clickUps").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;if(spend(clickCost(i))){S.clicks[i]++;draw()}});
document.getElementById("wallet").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;
 if(S.cards[i]){S.card=i;toast(`Now using ${CARDS[i].n}`)}else if(S.cash>=CARDS[i].c){S.cash-=CARDS[i].c;S.cards[i]=true;S.card=i;toast(`Approved! ${CARDS[i].n} unlocked`)}else toast(`Need ${fmt(CARDS[i].c)} for ${CARDS[i].n}`);draw()});
document.getElementById("stocks").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,a=b.dataset.a,s=S.stocks[i];
 if(a==="all"||a==="-1"){const q=a==="all"?s.h:Math.min(1,s.h);if(!q)return;const avg=s.cost/s.h;S.cash+=q*s.p;s.cost-=avg*q;s.h-=q;const pl=q*(s.p-avg);toast(`Sold ${q} ${STOCKS[i].t} for ${pl>=0?"+":""}${fmt(pl)}`)}
 else{let q=a==="max"?Math.floor(S.cash/s.p):+a;q=Math.min(q,Math.floor(S.cash/s.p));if(q<1){toast("Not enough cash");return}S.cash-=q*s.p;s.h+=q;s.cost+=q*s.p}
 draw()});
document.getElementById("reset").addEventListener("click",function(){if(this.dataset.c){S=fresh();save();this.textContent="Reset game";delete this.dataset.c;draw()}else{this.dataset.c=1;this.textContent="Click again to confirm";setTimeout(()=>{delete this.dataset.c;this.textContent="Reset game"},3000)}});

function spark(i){const c=document.getElementById("sc"+i),g=c.getContext("2d"),h=S.stocks[i].hist;const mn=Math.min(...h),mx=Math.max(...h),r=mx-mn||1;
 g.clearRect(0,0,220,88);const up=h[h.length-1]>=h[0];g.strokeStyle=up?"#5ee08a":"#ff6b6b";g.lineWidth=3;g.beginPath();
 h.forEach((v,k)=>{const x=k/(h.length-1)*216+2,y=84-(v-mn)/r*80;k?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
 g.lineTo(218,88);g.lineTo(2,88);g.closePath();g.fillStyle=up?"#5ee08a22":"#ff6b6b22";g.fill()}

function draw(){
 const $=id=>document.getElementById(id);
 $("cash").textContent=fmt(S.cash);$("pps").textContent=fmt(pps());$("ppc").textContent=fmt(ppc());$("nw").textContent=fmt(S.cash+stockVal());
 BIZ.forEach((b,i)=>{$("bo"+i).textContent=S.biz[i]?"×"+S.biz[i]:"";const c=bizCost(i);$("bb"+i).textContent=fmt(c);$("bb"+i).disabled=S.cash<c});
 CLICKS.forEach((b,i)=>{$("co"+i).textContent=S.clicks[i]?"×"+S.clicks[i]:"";const c=clickCost(i);$("cb"+i).textContent=fmt(c);$("cb"+i).disabled=S.cash<c});
 CARDS.forEach((c,i)=>{const e=$("cc"+i);e.classList.toggle("locked",!S.cards[i]);e.classList.toggle("equipped",S.card===i);$("ct"+i).textContent=S.card===i?"IN USE":S.cards[i]?"OWNED":fmt(c.c)});
 S.stocks.forEach((s,i)=>{const h=s.hist,ch=(s.p/h[0]-1)*100;$("sp"+i).innerHTML=`${fmt(s.p)} <span class="${ch>=0?"up":"dn"}">${ch>=0?"▲":"▼"}${Math.abs(ch).toFixed(1)}%</span>`;
  const pl=s.h?s.h*s.p-s.cost:0;$("sh"+i).innerHTML=s.h?`${s.h} sh · <span class="${pl>=0?"up":"dn"}">${pl>=0?"+":""}${fmt(pl)}</span>`:"0 shares"});
}

// income loop
let last=performance.now();
function tick(now){const dt=Math.min((now-last)/1000,1);last=now;const g=pps()*dt;S.cash+=g;S.total+=g;
 document.getElementById("cash").textContent=fmt(S.cash);requestAnimationFrame(tick)}
requestAnimationFrame(tick);

// market
function market(){S.stocks.forEach((s,i)=>{const d=STOCKS[i];let r=(Math.random()-.5)*2*d.v+d.d;
  if(Math.random()<.008){const up=Math.random()<.5;r+=up?.18:-.16;document.getElementById("news").textContent="📰 "+NEWS[up?"up":"dn"][Math.floor(Math.random()*3)].replace("{t}",d.t)}
  s.p=Math.max(.05,s.p*(1+r));s.hist.push(s.p);if(s.hist.length>40)s.hist.shift();spark(i)});draw()}
setInterval(market,1000);setInterval(save,3000);
S.stocks.forEach((_,i)=>spark(i));draw();
</script>
